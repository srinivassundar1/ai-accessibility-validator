<!DOCTYPE html>
<html lang="en">
<head><title>Accessible Page Example</title></head>
<body>

        <h1>Welcome</h1>
        <h2>About Us</h2>
        <img src="photo.jpg" alt="Team photo at the office">

        <a href="/about">About our company</a>
    </main>
</body>
</html>
