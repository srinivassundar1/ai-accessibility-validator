[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-accessibility-validator"
version = "0.1.0"
description = "AI-powered website accessibility validator for Section 508 and WCAG 2.1 compliance"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Your Name", email = "you@example.com"}]
keywords = ["accessibility", "wcag", "section-508", "a11y", "ai", "ada"]
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
crawler = ["playwright>=1.40"]
ai = ["openai>=1.0"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]
all = ["playwright>=1.40", "openai>=1.0"]

[project.scripts]
a11y = "a11y_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
